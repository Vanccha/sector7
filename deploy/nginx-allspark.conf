# /etc/nginx/sites-available/allspark.behlulalar.online.conf  (sites-enabled'a bağlanır)
# TLS: certbot --nginx -d allspark.behlulalar.online (sertifikayı ve 443 bloğunu o ekler).
server {
    listen 80;
    listen [::]:80;
    server_name allspark.behlulalar.online;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:18600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Canlı olaylar (SSE) için tamponlama kapalı, uzun okuma süresi.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
