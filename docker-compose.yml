# Lokal geliştirme: yalnız veritabanı.  `docker compose up -d db`
# Uygulama host'ta `npm run dev` ile çalışır.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sector7
      POSTGRES_PASSWORD: sector7
      POSTGRES_DB: sector7
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sector7 -d sector7"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
